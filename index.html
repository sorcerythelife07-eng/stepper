
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP8266 boshqaruv paneli</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      max-width: 460px;
      margin: 35px auto;
      padding: 24px;
      background: #1e293b;
      border-radius: 18px;
    }

    h1 { font-size: 25px; }

    .status {
      padding: 13px;
      border-radius: 10px;
      background: #334155;
      margin: 18px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .on { background: #16a34a; color: white; }
    .off { background: #dc2626; color: white; }

    #log {
      min-height: 100px;
      max-height: 240px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .small { color: #cbd5e1; font-size: 13px; }
  </style>
</head>

<body>
  <div class="panel">
    <h1>ESP8266 boshqaruv paneli</h1>
    <p class="small">Internet orqali masofadan boshqarish</p>

    <div class="status" id="status">
      Brokerga ulanmoqda...
    </div>

    <button class="on" id="onBtn" disabled>
      YOQISH — ON
    </button>

    <button class="off" id="offBtn" disabled>
      O‘CHIRISH — OFF
    </button>

    <h3>Qurilmadan kelgan javoblar</h3>
    <div id="log">Ulanish kutilmoqda...</div>
  </div>

  <script>
    // EMQX Cloud ma'lumotlari
    const HOST =
      "wss://m18ff663.ala.eu-central-1.emqxsl.com:8084/mqtt";

    const USERNAME = "WEB_MQTT_USERNAME";
    const PASSWORD = "WEB_MQTT_PASSWORD";

    const COMMAND_TOPIC = "myproject_83921/command";
    const REPLY_TOPIC = "myproject_83921/reply";

    const statusBox = document.getElementById("status");
    const logBox = document.getElementById("log");
    const onBtn = document.getElementById("onBtn");
    const offBtn = document.getElementById("offBtn");

    function log(text) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent += "\n[" + time + "] " + text;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setConnected(connected) {
      statusBox.textContent = connected
        ? "Ulandi — qurilma bilan aloqa mavjud"
        : "Ulanmoqda yoki aloqa uzilgan...";

      onBtn.disabled = !connected;
      offBtn.disabled = !connected;
    }

    const client = mqtt.connect(HOST, {
      clientId: "web_" + Math.random().toString(16).slice(2, 12),
      username: USERNAME,
      password: PASSWORD,
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 3000,
      keepalive: 30
    });

    client.on("connect", function () {
      setConnected(true);
      log("EMQX brokeriga ulandi.");

      client.subscribe(REPLY_TOPIC, function (err) {
        if (err) {
          log("Javob mavzusiga obuna bo‘lishda xato.");
        } else {
          log("Qurilma javoblari tinglanmoqda.");
        }
      });
    });

    client.on("reconnect", function () {
      setConnected(false);
      log("Qayta ulanishga urinish...");
    });

    client.on("offline", function () {
      setConnected(false);
    });

    client.on("error", function (err) {
      log("MQTT xatosi: " + err.message);
    });

    client.on("message", function (topic, payload) {
      log(topic + " → " + payload.toString());
    });

    function sendCommand(command) {
      if (!client.connected) {
        log("Brokerga ulanish yo‘q.");
        return;
      }

      client.publish(COMMAND_TOPIC, command, function (err) {
        if (err) {
          log("Buyruq yuborilmadi: " + err.message);
        } else {
          log("Buyruq yuborildi: " + command);
        }
      });
    }

    onBtn.addEventListener("click", function () {
      sendCommand("ON");
    });

    offBtn.addEventListener("click", function () {
      sendCommand("OFF");
    });
  </script>
</body>
</html>
