
<!-- DETAL SOZLAMALARI BO‘LIMI -->
<section id="page-detail" class="hidden">
  <h2 class="page-title">Detal sozlamalari</h2>
  <p class="subtitle">Qiymatlarni o‘zgartiring — chizma avtomatik yangilanadi.</p>

  <div class="card">
    <h3>Detal o‘lchamlari</h3>

    <div class="grid">
      <div>
        <label>Tashqi diametr d (mm)</label>
        <input id="diameter" type="number" min="1" value="60" oninput="updateDetailPreview()">
      </div>

      <div>
        <label>Ichki diametr d(i) (mm)</label>
        <input id="innerDiameter" type="number" min="0" value="20" oninput="updateDetailPreview()">
      </div>

      <div>
        <label>Markaziy bo‘rtma diametri d(o') (mm)</label>
        <input id="stepDiameter" type="number" min="1" value="30" oninput="updateDetailPreview()">
      </div>

      <div>
        <label>Asosiy qalinlik dq (mm)</label>
        <input id="detailThickness" type="number" min="1" value="20" oninput="updateDetailPreview()">
      </div>

      <div>
        <label>Bo‘rtma balandligi q(m) (mm)</label>
        <input id="middleThickness" type="number" min="0" value="3" oninput="updateDetailPreview()">
      </div>

      <div>
        <label>Aylanish tezligi (RPM)</label>
        <input id="rpm" type="number" min="1" value="500">
      </div>

      <div>
        <label>Ishlov berish chuqurligi (mm)</label>
        <input id="depth" type="number" min="0" value="2">
      </div>
    </div>

    <button class="btn blue" onclick="saveDetail()">Parametrlarni saqlash</button>
  </div>

  <div class="card">
    <h3>Detalning jonli chizmasi</h3>

    <div class="detail-preview">
      <svg id="detailSvg" viewBox="0 0 700 360"
           xmlns="http://www.w3.org/2000/svg">

        <defs>
          <linearGradient id="metalFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#93c5fd"/>
            <stop offset="1" stop-color="#2563eb"/>
          </linearGradient>
        </defs>

        <text x="175" y="24" fill="white" text-anchor="middle">YON KO‘RINISH</text>

        <path id="partShape" fill="url(#metalFill)"
              fill-rule="evenodd" stroke="#bfdbfe" stroke-width="2"/>

        <path id="boreLine" fill="none" stroke="#fbbf24"
              stroke-width="2" stroke-dasharray="6 4"/>

        <line x1="25" y1="180" x2="325" y2="180"
              stroke="#64748b" stroke-dasharray="5 6"/>

        <text id="svgD" x="175" y="48" fill="white"
              text-anchor="middle" font-size="13"></text>

        <text id="svgDi" x="175" y="330" fill="#fbbf24"
              text-anchor="middle" font-size="13"></text>

        <text id="svgDq" x="175" y="350" fill="white"
              text-anchor="middle" font-size="12"></text>

        <text x="520" y="24" fill="white"
              text-anchor="middle">YUQORIDAN KO‘RINISH</text>

        <circle id="endOuter" cx="520" cy="185" r="105"
                fill="url(#metalFill)" stroke="#bfdbfe" stroke-width="2"/>

        <circle id="endStep" cx="520" cy="185" r="52"
                fill="#172337" stroke="#93c5fd" stroke-width="3"/>

        <circle id="endHole" cx="520" cy="185" r="20"
                fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>

        <line x1="400" y1="185" x2="640" y2="185"
              stroke="#64748b" stroke-dasharray="4 5"/>

        <line x1="520" y1="65" x2="520" y2="305"
              stroke="#64748b" stroke-dasharray="4 5"/>

        <text id="svgDo" x="520" y="330" fill="#93c5fd"
              text-anchor="middle" font-size="13"></text>
      </svg>
    </div>
  </div>
</section>

<script>
function updateDetailPreview() {
  const value = id =>
    Number(document.getElementById(id).value) || 0;

  const d = Math.max(1, value("diameter"));
  const di = Math.max(0, value("innerDiameter"));
  const db = Math.max(1, value("stepDiameter"));
  const dq = Math.max(1, value("detailThickness"));
  const qm = Math.max(0, value("middleThickness"));

  // YON KO‘RINISH
  const scale = Math.min(190 / d, 230 / (dq + qm || 1));

  const cx = 175;
  const baseY = 275;

  const halfD = d * scale / 2;
  const halfB = db * scale / 2;
  const halfI = di * scale / 2;

  const xL = cx - halfD;
  const xR = cx + halfD;

  const bossL = cx - halfB;
  const bossR = cx + halfB;

  const yTop = baseY - dq * scale;
  const yBoss = yTop - qm * scale;

  // Asosiy silindr va markaziy bo‘rtma konturi
  const path = `
    M ${xL} ${baseY}
    L ${xL} ${yTop}
    L ${bossL} ${yTop}
    L ${bossL} ${yBoss}
    L ${bossR} ${yBoss}
    L ${bossR} ${yTop}
    L ${xR} ${yTop}
    L ${xR} ${baseY}
    Z
  `;

  // Ichki teshik
  const hole = di > 0 ? `
    M ${cx-halfI} ${baseY+1}
    L ${cx-halfI} ${yBoss-1}
    L ${cx+halfI} ${yBoss-1}
    L ${cx+halfI} ${baseY+1}
    Z
  ` : "";

  document.getElementById("partShape")
    .setAttribute("d", path + hole);

  document.getElementById("boreLine")
    .setAttribute("d", di > 0 ? `
      M ${cx-halfI} ${baseY}
      L ${cx-halfI} ${yTop}
      M ${cx+halfI} ${baseY}
      L ${cx+halfI} ${yTop}
    ` : "");

  // YUQORIDAN KO‘RINISH
  const R = 105;
  const k = R / d;

  document.getElementById("endOuter")
    .setAttribute("r", R);

  document.getElementById("endStep")
    .setAttribute("r", Math.max(1, db * k));

  document.getElementById("endHole")
    .setAttribute("r", Math.max(0, di * k));

  // O‘lcham yozuvlari
  document.getElementById("svgD").textContent =
    `d = ${d} mm`;

  document.getElementById("svgDi").textContent =
    `d(i) = ${di} mm`;

  document.getElementById("svgDo").textContent =
    `d(o') = ${db} mm`;

  document.getElementById("svgDq").textContent =
    `dq = ${dq} mm · q(m) = ${qm} mm`;
}

function saveDetail() {
  const p = {
    diameter: Number(document.getElementById("diameter").value),
    innerDiameter: Number(document.getElementById("innerDiameter").value),
    stepDiameter: Number(document.getElementById("stepDiameter").value),
    detailThickness: Number(document.getElementById("detailThickness").value),
    middleThickness: Number(document.getElementById("middleThickness").value),
    rpm: Number(document.getElementById("rpm").value),
    depth: Number(document.getElementById("depth").value)
  };

  if (
    p.diameter <= 0 ||
    p.innerDiameter < 0 ||
    p.stepDiameter <= p.innerDiameter ||
    p.stepDiameter >= p.diameter ||
    p.detailThickness <= 0 ||
    p.middleThickness < 0 ||
    p.rpm <= 0 ||
    p.depth < 0
  ) {
    alert("O‘lchamlarni tekshiring: d(i) < d(o') < d bo‘lishi kerak.");
    return;
  }

  localStorage.setItem("stepperDetail", JSON.stringify(p));
  updateDetailPreview();
  alert("Detal parametrlari saqlandi.");
}

updateDetailPreview();
</script>
